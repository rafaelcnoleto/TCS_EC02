<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Funcionários</title>
</head>
<body>
  <h1>Gestão de Funcionários</h1>

  <h2>Cadastro</h2>
  <form id="form-funcionario">
    <p>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" required>
    </p>
    <p>
      <label for="idade">Idade:</label>
      <input type="number" id="idade" min="0" required>
    </p>
    <p>
      <label for="cargo">Cargo:</label>
      <input type="text" id="cargo" required>
    </p>
    <p>
      <label for="salario">Salário (R$):</label>
      <input type="number" id="salario" min="0" step="0.01" required>
    </p>
    <p>
      <button type="button" id="btn-salvar">Cadastrar</button>
      <button type="button" id="btn-cancelar" hidden>Cancelar edição</button>
    </p>
  </form>

  <h2>Funcionários cadastrados</h2>
  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Idade</th>
        <th>Cargo</th>
        <th>Salário</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-funcionarios"></tbody>
  </table>

  <h2>Relatórios</h2>
  <p>
    <button type="button" id="btn-salario-alto">Salário maior que R$ 5.000</button>
    <button type="button" id="btn-media">Média salarial</button>
    <button type="button" id="btn-cargos">Cargos únicos</button>
    <button type="button" id="btn-maiusculo">Nomes em maiúsculo</button>
  </p>
  <div id="relatorio"></div>

  <script src="funcionario.js"></script>
  <script src="app.js"></script>
</body>
</html>
